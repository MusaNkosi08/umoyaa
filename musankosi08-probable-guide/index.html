<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#007A4D">
<title>UMOYA — Matric made clear</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23FAF6EE' stroke='%23007A4D' stroke-width='4'/%3E%3Cpath d='M15 35c11 9 23 7 31-5M20 24c8-6 17-5 24 1M28 43c8 2 14-1 19-7' fill='none' stroke='%23007A4D' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='18' cy='35' r='3' fill='%23FFB612'/%3E%3C/svg%3E">
<style>
:root{--bg:#FAF6EE;--ink:#1C1C1C;--green:#007A4D;--gold:#FFB612;--red:#DE3831;--muted:#6d6a64;--card:#fffdf9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}header{padding:18px 20px 14px;background:var(--bg);position:sticky;top:0;z-index:2}header:after{content:"";display:block;height:5px;margin:15px -20px 0;background:repeating-linear-gradient(135deg,var(--green) 0 12px,var(--gold) 12px 18px,var(--ink) 18px 20px,var(--bg) 20px 27px)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;color:var(--green)}.brand svg{width:42px;height:42px}.brand span{font-size:1.35rem}.view{display:none;max-width:680px;margin:auto;padding:28px 20px 100px}.view.active{display:block}h1{font-size:clamp(2rem,8vw,3.8rem);line-height:1.05;margin:38px 0 18px;letter-spacing:-.04em}h2{font-size:1.65rem;margin:0 0 18px}.subtitle{font-size:1.12rem;color:var(--muted);max-width:31rem}.primary{background:var(--green);color:white;padding:14px 22px;border-radius:12px;font-weight:700;margin:24px 0}.examples{display:grid;gap:12px;margin-top:20px}.example,.history-item{background:var(--card);border:1px solid #e6dfd3;border-radius:14px;text-align:left;padding:15px;color:var(--ink)}.example:hover,.history-item:hover{border-color:var(--gold)}.chat-list{display:flex;flex-direction:column;gap:14px;min-height:45vh}.bubble{max-width:90%;padding:13px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:var(--green);color:white;border-bottom-right-radius:4px}.bubble.ai{align-self:flex-start;background:white;border:1px solid #e6dfd3;border-bottom-left-radius:4px}.composer{position:fixed;bottom:62px;left:0;right:0;background:var(--bg);padding:10px 20px;border-top:1px solid #e6dfd3;display:flex;gap:8px;z-index:2}.composer input{min-width:0;flex:1;padding:12px;border:1px solid #cfc7ba;border-radius:12px;background:white}.composer button{background:var(--green);color:white;border-radius:12px;padding:0 16px;font-weight:700}.composer button:disabled{opacity:.55}.card{background:var(--card);border:1px solid #e6dfd3;border-radius:16px;padding:16px}.pill{display:inline-block;background:var(--gold);padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:800}.steps{margin:14px 0}.step{padding:9px 0;border-bottom:1px solid #eee6d9}.answer{border:3px solid var(--gold);border-radius:12px;padding:13px;margin-top:14px}.check{margin-top:14px;color:var(--green);font-weight:650}.next{background:var(--green);color:white;border-radius:10px;padding:10px 14px;margin-top:12px;font-weight:700}.show-all{background:none;color:var(--green);text-decoration:underline;margin:12px 0 0 10px}.error{color:var(--red);background:#fff0ee;border:1px solid #f1bbb7;padding:12px;border-radius:12px}.history-controls{display:flex;gap:8px;margin-bottom:16px}.history-controls select,.danger{padding:10px;border:1px solid #cfc7ba;border-radius:10px;background:white}.danger{color:var(--red);margin-left:auto}.history-item{display:block;width:100%;margin-bottom:10px}.history-item small{display:block;color:var(--muted);margin-top:5px}.history-actions{display:flex;gap:8px;margin-top:10px}.history-actions button{background:none;color:var(--green);padding:0;text-decoration:underline}.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:white;border-top:1px solid #e6dfd3;display:flex;z-index:3}.bottom-nav button{flex:1;background:white;color:var(--muted);font-weight:700}.bottom-nav button.active{color:var(--green);border-top:4px solid var(--gold)}.empty{color:var(--muted)}
</style>
</head>
<body>
<header><div class="brand"><svg viewBox="0 0 64 64" aria-label="UMOYA wind mark"><circle cx="32" cy="32" r="29" fill="#FAF6EE" stroke="#007A4D" stroke-width="4"/><path d="M15 35c11 9 23 7 31-5M20 24c8-6 17-5 24 1M28 43c8 2 14-1 19-7" fill="none" stroke="#007A4D" stroke-width="4" stroke-linecap="round"/><circle cx="18" cy="35" r="3" fill="#FFB612"/></svg><span>UMOYA</span></div></header>
<main>
<section id="home" class="view active"><h1>Matric made clear, one step at a time.</h1><p class="subtitle">A patient study assistant for South African learners. Ask a CAPS question and learn the why, not just the answer.</p><button class="primary" data-view="ask">Start learning</button><h2>Try an example</h2><div class="examples"><button class="example">Solve 2x² - 5x - 3 = 0</button><button class="example">A 4 kg object has a net force of 20 N. What is its acceleration?</button><button class="example">Ndicela undincede: explain photosynthesis in English and isiXhosa.</button></div></section>
<section id="ask" class="view"><h2>Ask UMOYA</h2><div id="chat" class="chat-list"></div><form id="form" class="composer"><input id="input" autocomplete="off" placeholder="Type a school question..."><button id="send">Send</button></form></section>
<section id="history" class="view"><h2>History</h2><div class="history-controls"><select id="filter"><option value="">All subjects</option></select><button class="danger" id="clear">Clear all</button></div><div id="history-list"></div></section>
</main>
<nav class="bottom-nav"><button data-view="home" class="active">Home</button><button data-view="ask">Ask</button><button data-view="history">History</button></nav>
<script>
const $=s=>document.querySelector(s),chat=$("#chat"),input=$("#input"),form=$("#form"),send=$("#send"),historyList=$("#history-list"),filter=$("#filter");
let messages=[], history=JSON.parse(localStorage.getItem("umoya-history")||"[]");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function go(view){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===view));document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="history")renderHistory();if(view==="ask")input.focus()}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));
document.querySelectorAll(".example").forEach(b=>b.onclick=()=>{go("ask");input.value=b.textContent;input.focus()});
function bubble(text,who){const el=document.createElement("div");el.className="bubble "+who;el.innerHTML=esc(text);chat.append(el);chat.scrollTop=chat.scrollHeight;return el}
function parseReply(reply){const subject=(reply.match(/^SUBJECT:\s*(.*)$/mi)||[])[1];const steps=[...reply.matchAll(/^STEP \d+:\s*(.*)$/gmi)].map(m=>m[1]);const answer=(reply.match(/^ANSWER:\s*(.*)$/mi)||[])[1];const check=(reply.match(/^CHECK:\s*(.*)$/mi)||[])[1];return subject&&steps.length&&answer?{subject,steps,answer,check}:null}
function card(reply,subject){const data=parseReply(reply);if(!data)return bubble(reply,"ai");const el=document.createElement("div");el.className="bubble ai";el.innerHTML='<div class="card"><span class="pill">'+esc(data.subject)+'</span><div class="steps"></div><button class="next">Next step</button><button class="show-all">Show all</button><div class="answer"><b>Answer</b><div>'+esc(data.answer)+'</div></div>'+(data.check?'<div class="check"><b>Check:</b> '+esc(data.check)+'</div>':'')+'</div>';const stepsEl=el.querySelector(".steps"),next=el.querySelector(".next"),all=el.querySelector(".show-all");let shown=0;function draw(){stepsEl.innerHTML=data.steps.slice(0,shown).map((s,i)=>'<div class="step"><b>Step '+(i+1)+':</b> '+esc(s)+'</div>').join("");next.hidden=shown>=data.steps.length;next.textContent=shown===0?"Show first step":"Next step"}next.onclick=()=>{shown=Math.min(shown+1,data.steps.length);draw()};all.onclick=()=>{shown=data.steps.length;draw()};draw();chat.append(el);chat.scrollTop=chat.scrollHeight;return el}
async function ask(question){if(!question.trim())return;go("ask");bubble(question,"user");messages.push({role:"user",content:question});input.value="";send.disabled=true;send.textContent="UMOYA is thinking...";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});const data=await r.json();if(!r.ok)throw Error(data.error||"Please try again.");messages.push({role:"assistant",content:data.reply});const parsed=parseReply(data.reply);card(data.reply,parsed?.subject);history.unshift({question,subject:parsed?.subject||"General",reply:data.reply,date:new Date().toISOString()});localStorage.setItem("umoya-history",JSON.stringify(history));}catch(e){const el=document.createElement("div");el.className="bubble ai error";el.textContent="Sorry, I couldn't reach UMOYA. Please check your connection and try again.";chat.append(el)}finally{send.disabled=false;send.textContent="Send"}}
form.onsubmit=e=>{e.preventDefault();ask(input.value)};function renderHistory(){const selected=filter.value;const subjects=[...new Set(history.map(x=>x.subject).filter(Boolean))];filter.innerHTML='<option value="">All subjects</option>'+subjects.map(s=>'<option>'+esc(s)+'</option>').join("");filter.value=subjects.includes(selected)?selected:"";historyList.innerHTML="";const shown=history.filter(x=>!filter.value||x.subject===filter.value);if(!shown.length){historyList.innerHTML='<p class="empty">No solved questions yet.</p>';return}shown.forEach((item)=>{const index=history.indexOf(item),el=document.createElement("div");el.className="history-item";el.innerHTML='<span class="pill">'+esc(item.subject)+'</span><div>'+esc(item.question)+'</div><small>'+new Date(item.date).toLocaleString()+'</small><div class="history-actions"><button class="reopen">Reopen</button><button class="delete">Delete</button></div>';el.querySelector(".reopen").onclick=()=>{go("ask");chat.innerHTML="";card(item.reply,item.subject)};el.querySelector(".delete").onclick=()=>{history.splice(index,1);localStorage.setItem("umoya-history",JSON.stringify(history));renderHistory()};historyList.append(el)})}filter.onchange=renderHistory;$("#clear").onclick=()=>{if(history.length&&confirm("Clear all saved questions?")){history=[];localStorage.removeItem("umoya-history");renderHistory()}}
</script>
</body>
</html>
